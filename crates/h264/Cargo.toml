[package]
name = "filmcraft-h264"
description = "Clean-room pure-Rust H.264/AVC decoder (ITU-T H.264)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]
# Stage timing printed by the `h264dec` example (development only).
profile = []

[dependencies]
filmcraft-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
