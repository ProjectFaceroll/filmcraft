name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 120
      # Temporary check of #3000 (scrub output thread) on Windows and macOS; this branch is deleted
      # afterwards and never merged.
      os: '["windows-latest","macos-latest"]'
      packages: ""
      command: >-
        cargo clippy -p filmcraft -p filmcraft-ui-egui --all-targets --locked -- -D warnings &&
        cargo test -p filmcraft --locked --bin filmcraft audio &&
        cargo test -p filmcraft-ui-egui --locked --no-fail-fast -- scrub audio_recovery transport playback
